<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASCII Visualizer</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <nav class="app-tabs" aria-label="Application sections">
      <button id="viewerTabButton" class="app-tab" type="button" role="tab" aria-selected="true" aria-controls="viewerTab">Viewer</button>
      <button id="converterTabButton" class="app-tab" type="button" role="tab" aria-selected="false" aria-controls="converterTab">Convert URL</button>
    </nav>

    <section id="viewerTab" class="tab-panel" role="tabpanel" aria-labelledby="viewerTabButton">
      <div class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>ASCII Visualizer</h1>
            <p id="rootPath">Loading folder...</p>
          </div>
          <button id="refreshButton" class="icon-button" title="Refresh file list" aria-label="Refresh file list">
            <span aria-hidden="true">↻</span>
          </button>
        </header>

        <form id="folderForm" class="folder-form">
          <label for="folderInput">Folder path</label>
          <div class="folder-row">
            <input id="folderInput" type="text" placeholder="/path/to/ascii-folder" autocomplete="off">
            <button id="browseFolderButton" class="text-button" type="button">Browse</button>
          </div>
          <input id="directoryInput" class="visually-hidden" type="file" webkitdirectory directory multiple>
          <p id="folderStatus" role="status"></p>
        </form>

        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Filter loaded files" autocomplete="off">
        </div>

        <div class="list-meta">
          <span id="fileCount">0 files</span>
          <select id="sortSelect" aria-label="Sort files">
            <option value="name">Name</option>
            <option value="modified">Modified</option>
            <option value="size">Size</option>
            <option value="dimensions">Dimensions</option>
          </select>
        </div>

        <nav id="fileList" class="file-list" aria-label="ASCII files"></nav>
      </aside>

      <main class="viewer-pane">
        <div class="toolbar">
          <div class="view-buttons">
            <button id="panelToggleButton" class="icon-button" type="button" title="Hide file panel" aria-label="Hide file panel" aria-pressed="false">
              <span aria-hidden="true">☰</span>
            </button>
            <button id="gridToggleButton" class="icon-button" type="button" title="Show grid view" aria-label="Show grid view" aria-pressed="false">
              <span aria-hidden="true">▦</span>
            </button>
            <button id="pageToggleButton" class="icon-button" type="button" title="Show continuous view" aria-label="Show continuous view" aria-pressed="false">
              <span aria-hidden="true">☷</span>
            </button>
          </div>

          <div class="file-heading">
            <h2 id="activeName">No file selected</h2>
            <p id="activeMeta">Choose a text file from the folder.</p>
          </div>

          <div class="controls">
            <label>
              Font
              <input id="fontSizeInput" type="range" min="6" max="28" value="11">
            </label>
            <label>
              Line
              <input id="lineHeightInput" type="range" min="70" max="160" value="100">
            </label>
            <label class="check-control">
              <input id="fitToggle" type="checkbox" checked>
              Fit
            </label>
            <label class="check-control">
              <input id="wrapToggle" type="checkbox">
              Wrap
            </label>
            <label class="check-control">
              <input id="invertToggle" type="checkbox">
              Invert
            </label>
          </div>
        </div>

        <div id="floatingFileName" class="floating-file-name">No file selected</div>

        <section class="canvas-wrap" id="canvasWrap">
          <div id="singleStage" class="single-stage">
            <pre id="asciiCanvas" aria-live="polite">Select a .txt file to visualize it here.</pre>
          </div>
          <div id="gridView" class="grid-view" aria-label="ASCII grid view"></div>
          <div id="pageView" class="page-view" aria-label="Continuous ASCII view"></div>
        </section>

        <div class="floating-nav" aria-label="File navigation">
          <button id="prevButton" class="nav-button" type="button">Previous</button>
          <button id="nextButton" class="nav-button" type="button">Next</button>
        </div>
      </main>
      </div>
    </section>

    <section id="converterTab" class="tab-panel converter-workspace" role="tabpanel" aria-labelledby="converterTabButton" hidden>
      <aside class="converter-controls">
        <header>
          <h1>Image to ASCII</h1>
          <p>PNG and JPEG from a public image URL</p>
        </header>
        <form id="converterForm">
          <label for="imageUrlInput">Image URL</label>
          <input id="imageUrlInput" type="url" inputmode="url" placeholder="https://example.com/image.jpg" autocomplete="url" required>

          <div class="converter-width-row">
            <label for="asciiWidthInput">Output width</label>
            <output id="asciiWidthValue" for="asciiWidthInput">120</output>
          </div>
          <input id="asciiWidthInput" type="range" min="20" max="500" value="120">

          <button id="convertButton" class="primary-button" type="submit">Convert</button>
          <button id="downloadButton" class="text-button" type="button" disabled>Download .txt</button>
          <p id="converterStatus" class="converter-status" role="status"></p>
        </form>
      </aside>

      <main class="converter-preview">
        <header>
          <div>
            <h2 id="converterFilename">No conversion yet</h2>
            <p id="converterMeta">ASCII preview</p>
          </div>
        </header>
        <div class="converter-canvas">
          <pre id="converterOutput" aria-live="polite"></pre>
        </div>
      </main>
    </section>

    <script src="static/app.js"></script>
    <script src="static/converter.js"></script>
  </body>
</html>
